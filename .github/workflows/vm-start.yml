name: VM start

on:
  workflow_dispatch: {}

jobs:
  start:
    runs-on: ubuntu-latest
    env:
      INSTANCE: ${{ secrets.GCP_INSTANCE_NAME }}
      ZONE: ${{ secrets.GCP_ZONE }}
      PROJECT: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Start the VM
        run: |
          gcloud compute instances start "$INSTANCE" --zone="$ZONE" --project="$PROJECT"

      - name: Wait for the VM to report RUNNING
        run: |
          for i in $(seq 1 30); do
            status=$(gcloud compute instances describe "$INSTANCE" --zone="$ZONE" --project="$PROJECT" --format='get(status)')
            echo "Instance status: $status"
            if [ "$status" = "RUNNING" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Instance never reached RUNNING" >&2
          exit 1

      # GCP assigns a new ephemeral external IP on every stop/start unless
      # a static IP is reserved, so resolve it fresh here rather than
      # relying on a possibly-stale secret.
      - name: Resolve current external IP
        id: get-ip
        run: |
          ip=$(gcloud compute instances describe "$INSTANCE" --zone="$ZONE" --project="$PROJECT" \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "Resolved external IP: $ip"
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: Wait for SSH to be reachable
        run: |
          ip="${{ steps.get-ip.outputs.ip }}"
          for i in $(seq 1 30); do
            if timeout 5 bash -c "echo > /dev/tcp/$ip/22" 2>/dev/null; then
              echo "SSH is reachable on $ip"
              exit 0
            fi
            echo "Waiting for SSH on $ip..."
            sleep 5
          done
          echo "SSH never became reachable on $ip" >&2
          exit 1

      - name: Deploy latest code and (re)start the checker service
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.get-ip.outputs.ip }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VM_DEPLOY_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            source venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart bms-availability
            sleep 2
            systemctl is-active --quiet bms-availability
